name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify docs-only changes
        id: classify
        uses: ./.github/actions/classify-docs-only
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}

  test:
    name: "Shard ${{ matrix.shard }}/${{ matrix.total }}"
    needs: classify
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        total: [6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: node ./scripts/run-node-tests.mjs --test-shard=${{ matrix.shard }}/${{ matrix.total }}
      - name: Upload shard timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-timings
          path: shard-*-timings.json
          retention-days: 14
          if-no-files-found: ignore

  audits:
    name: "Audits"
    needs: classify
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build bundles
        run: npm run build
      - name: Client-bundle audit
        run: npm run audit:client
      - name: Punctuation content audit
        run: npm run audit:punctuation-content -- --strict --generated-per-family 4 --min-validator-coverage-by-skill sentence_endings=1,list_commas=12,apostrophe_contractions=6,apostrophe_possession=10,speech=18,fronted_adverbial=16,parenthesis=17,comma_clarity=5,colon_list=16,semicolon=15,dash_clause=10,semicolon_list=5,bullet_points=12,hyphen=6 --min-fixed-items-by-skill sentence_endings=12,apostrophe_contractions=12,comma_clarity=12,semicolon_list=12,hyphen=12,dash_clause=12
      - name: Wrangler deploy dry-run (schema canary)
        continue-on-error: true
        run: npm run check

  ci-gate:
    name: "Node Tests (gate)"
    needs: [test, audits]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Download shard timings
        if: always() && needs.test.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*-timings
          merge-multiple: true
      - name: Check shard balance
        if: always() && needs.test.result == 'success'
        run: |
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('.').filter(f => f.startsWith('shard-') && f.endsWith('-timings.json'));
            if (files.length < 2) { console.log('Not enough timing data'); process.exit(0); }
            const shards = files.map(f => JSON.parse(fs.readFileSync(f)));
            const durations = shards.map(s => s.wallMs);
            const max = Math.max(...durations);
            const min = Math.min(...durations);
            const ratio = max / min;
            console.log('Shard balance: max=' + max + 'ms min=' + min + 'ms ratio=' + ratio.toFixed(2));
            if (max > 120000) { console.log('::error::Heaviest shard ' + max + 'ms exceeds 120s ceiling — seed sweep or file split required'); process.exit(1); }
            if (ratio > 2.0) console.log('::warning::Shard imbalance detected (ratio ' + ratio.toFixed(2) + ' > 2.0). Consider re-sweeping seed.');
            const allFiles = shards.flatMap(s => Object.entries(s.files || {}));
            allFiles.filter(([,ms]) => ms > 90000).forEach(([f,ms]) => console.log('::warning::File ' + f.split('/').pop() + ' took ' + ms + 'ms — consider splitting if this recurs'));
          "
      - name: Evaluate results
        run: |
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "::error::Test shards failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" = "cancelled" ]; then
            echo "::error::Test shards cancelled"
            exit 1
          fi
          if [ "${{ needs.audits.result }}" = "failure" ]; then
            echo "::error::Audits failed"
            exit 1
          fi
          echo "All checks passed"
